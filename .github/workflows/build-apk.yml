name: Build Diwan Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir unpacked
          unzip -q *.zip -d unpacked

      - name: Build APK
        run: |
          cd unpacked/DiwanOfflineAndroid
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DiwanOffline-debug-apk
          path: unpacked/DiwanOfflineAndroid/app/build/outputs/apk/debug/app-debug.apk
